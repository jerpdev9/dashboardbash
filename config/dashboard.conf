# TAB 1 — Home (hora · audio)
new_tab Home
layout tall
launch sh -lc 'LC_TIME=es_CL.UTF-8 tclock -c "#E6B35A"'
launch cava

# TAB 2 — System
new_tab System
launch btop

# TAB 3 — Network
new_tab Network
layout tall
launch bmon
launch sh -lc 'watch -n 2 "ss -tulpn"'

# TAB 4 — Hardware (GPU)
new_tab Hardware
launch nvtop

# TAB 5 — Disks
new_tab Disks
launch gdu -d

# TAB 6 — Monitor
new_tab Monitor
launch btm

# TAB 7 — Files
new_tab Files
launch ranger

# TAB 8 — Logs
new_tab Logs
layout tall
launch journalctl -f
